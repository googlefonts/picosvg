[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.pytype]
inputs = ["src/picosvg"]
# pytype 0, circular imports 1
# https://github.com/google/pytype/issues/428
disable = ["pyi-error"]
# generated by setuptools_scm at build time; its PEP 604 annotations
# (`str | None`) aren't analyzable by pytype
exclude = ["src/picosvg/_version.py"]
